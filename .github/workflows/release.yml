name: Build VSIX and Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Compile extension
        run: npm run compile

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$NAME-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npx vsce package --out "${{ steps.meta.outputs.vsix }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}"
          path: "${{ steps.meta.outputs.vsix }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ steps.meta.outputs.vsix }}"
          name: "Refined DenizenScript ${{ steps.meta.outputs.version }}"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          generate_release_notes: true

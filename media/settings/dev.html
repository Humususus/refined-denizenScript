<!DOCTYPE html>
<!-- Browser harness for the settings page (not shipped). Regenerate the state with
     `node scripts/make-settings-dev-state.js`. ?light=1 swaps in Light+ theme variables, and
     ?nostyle=1 drops the dark set (shows the CSS fallbacks). Writes are logged and applied
     to the canned state, so the page behaves as it would against the host. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denizen: Settings (dev)</title>
<link rel="stylesheet" href="dev-theme.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div id="app"></div>
<script src="dev-state.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.className = q.get('light') ? 'light' : (q.get('nostyle') ? '' : 'dark');
  window.DEV_WRITES = [];
  window.acquireVsCodeApi = () => ({
    getState: () => null,
    setState: () => {},
    postMessage: m => {
      if (m.kind === 'ready') {
        // ?section=sources: the host asks for a section before the first state (the R7 quick fix).
        if (q.get('section')) window.postMessage({ kind: 'showSection', id: q.get('section') }, '*');
        setTimeout(() => window.postMessage(window.DEV_STATE, '*'), 0);
      } else if (m.kind === 'sources') {
        window.DEV_WRITES.push(m);
        window.DEV_STATE.sources = Object.assign({}, m.value, { official: window.DEV_STATE.sources.official });
        setTimeout(() => window.postMessage(window.DEV_STATE, '*'), 30);
      } else if (m.kind === 'addSource') {
        window.DEV_WRITES.push(m);
        // A rough stand-in for metaSources.sourceFromInput; the real rules are unit-tested.
        const repo = /^(?:https?:\/\/)?github\.com\/([\w.-]+)\/([\w.-]+?)(?:\.git)?\/?$/.exec(m.input.trim());
        const zip = /^https:\/\/\S+\.zip$/.test(m.input.trim());
        const ok = !!(repo || zip);
        if (ok) {
          const url = repo ? `https://github.com/${repo[1]}/${repo[2]}/archive/HEAD.zip` : m.input.trim();
          window.DEV_STATE.sources.custom.push({ name: repo ? repo[2] : url.split('/').pop().replace(/\.zip$/, ''), url, enabled: true });
          setTimeout(() => window.postMessage(window.DEV_STATE, '*'), 30);
        }
        setTimeout(() => window.postMessage({ kind: 'addResult', ok }, '*'), 10);
      } else if (m.kind === 'reinstall') {
        window.DEV_WRITES.push(m);
        // ?nostatus=1: the server never reports (it failed); the host's command times out.
        if (q.get('nostatus')) {
          setTimeout(() => window.postMessage({ kind: 'reinstallDone', ok: false }, '*'), 300);
          return;
        }
        setTimeout(() => window.postMessage({ kind: 'reinstallDone', ok: true }, '*'), 850);
        setTimeout(() => {
          window.DEV_STATE.metaLoadedAt = Date.now();
          window.DEV_STATE.metaStatusLine = 'Meta loaded just now · 6 sources · 1,214 commands, tags and events';
          window.postMessage(window.DEV_STATE, '*');
        }, 800);
      } else if (m.kind === 'set') {
        window.DEV_WRITES.push(m);
        // ?stale=1: before each write lands, a state from before it arrives (the echo of an
        // earlier write, as happens in VS Code when writes overlap).
        if (q.get('stale')) window.postMessage(JSON.parse(JSON.stringify(window.DEV_STATE)), '*');
        console.log('set', m.key, JSON.stringify(m.value));
        const s = window.DEV_STATE;
        const color = m.key.replace(/^denizenscript\.theme_colors\./, '');
        if (m.key === 'denizenscript.behaviors.use_custom_syntax_colors') s.paletteOn = m.value;
        else if (color === 'text_color_map') s.colorMap = m.value.split(',').map(e => { const [name, c] = e.split('='); return { name, color: c }; });
        else if (s.colors[color]) {
          const [head, ...parts] = m.value.split('|');
          s.colors[color] = { color: head, text: head, bold: parts.includes('weight=bold'), italic: parts.includes('style=italic'), rest: parts.filter(p => !/^(weight|style)=/.test(p)), overridden: false };
        } else {
          for (const k in s.options) if (m.key.endsWith(k)) s.options[k].value = m.value;
        }
        setTimeout(() => window.postMessage(s, '*'), 30);
      }
    },
  });
</script>
<script>
  // Cache-busted, so an edit to settings.js is picked up on reload.
  const s = document.createElement('script');
  s.src = 'settings.js?t=' + Date.now();
  document.body.appendChild(s);
</script>
</body>
</html>
